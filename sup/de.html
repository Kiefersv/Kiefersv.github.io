<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fortune Cookie</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #000;
      color: #fff;
      margin: 0;
      padding: 0;
    }

    h1 {
      margin: 20px 0;
      font-size: 3.5rem;
    }
    h2 {
      margin: 0 15vw 20px 15vw;
      font-size: 1.4rem;
      font-weight: normal;
    }

    .choice-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      margin: 0;
      padding: 0;
      gap: 20px;
    }

    .choice {
      flex: 1 1 45%;
      max-width: 1000px;
      cursor: pointer;
    }

    .choice img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.2s;
    }

    .choice img:hover {
      transform: scale(1.04);
    }

    .choice p {
      margin-bottom: 12px;
      font-size: 1.8rem;
      font-weight: normal;
      color: #ffffff;
      text-align: center;
    }

    .final-img {
      max-height: 65vh;
      max-width:100%;
      width: auto;
    }

    .play-again {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      background-color: #00FF75;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.2s;
    }

    .play-again:hover {
      background-color: #44ff98;
      transform: scale(1.04);
    }

    /* responsive */
    @media screen and (max-width: 900px) {
        h1 {
          margin: 40px 0 10px 0;
          font-size: 3rem;
        }
        h2 {
          margin: 0 5vw 20px 5vw;
          font-size: 1.2rem;
        }
        .choice p {
          font-size: 1.4rem;
        }
        .play-again {
          font-size: 0.9rem;
          padding: 10px 18px;
        }
        .choice {
          flex: 1 1 100%;
          max-width: 700px;
        }
    }
    @media (max-width: 600px) {
        h1 {
          margin: 30px 5vw 10px 5vw;
          font-size: 2rem;
        }
        h2 {
          font-size: 1.1rem;
        }

        .choice p {
          font-size: 1.6rem;
        }

      .choice {
        flex: 1 1 100%;
        max-width: none;
      }

      .play-again {
        font-size: 0.8rem;
        padding: 10px 16px;
      }
    }
  </style>
</head>
<body>

  <h1 id="main-title">Triff eine Wahl.</h1>
  <h2 id="sub-title">Wie wirst du die Wahrheit herausfinden?</h2>
  <div id="game"></div>

  <script>

    const FINAL_SUBTITLE = "";
    // const FINAL_SUBTITLE = "Here is where the journey begins:";

    const paths = {

      },

      B21: {

      },
      B22: {

        next: ["final5", "final6"]
      },
      B32: {

        labels: ["Teile es mit deinem Haustier?", "Teile es mit der Welt?"],
        next: ["final7", "final8"]
      },
      B33: {
        images: ["img4e.jpg", "img4f.jpg"],
        labels: ["Einen Schnappschuss machen?", "Eine Postkarte senden?"], // "Take pictures all over the world?" "Take pictures all around the globe?"
        next: ["final9", "final10"]
      },
      B34: {
        images: ["img4g.jpg", "img4h.jpg"],
        labels: ["Einen Spieleabend geniessen?", "Einen Film anschauen?"],
        next: ["final11", "B41"]
      },
      B41: {
        images: ["img5b.jpg", "img5a.jpg"],
        labels: ["Gemeinsam lachen?<br>&nbsp;", "Gemeinsam schreien?<br>(ACHTUNG, schockierendes Bild!)"],
        next: ["final13", "final12"]
      },

      /* FINAL NODES WITH CUSTOM MESSAGES */
      final1:  { final: "01-bio.jpg",      message: "Die Laborergebnisse liegen vor: Die Analyse der biologischen Proben hat bestätigt, dass es sich beim Fötus um einen Jungen handelt – mit einem voraussichtlichen Geburtstermin Ende Januar&nbsp;2026!" },
  final2:  { final: "02-anat.jpg",     message: "<i>*Professorenstimme*</i>&nbsp; Also gut, alle bitte Seite 352 im Lehrbuch aufschlagen. Könnt ihr die detaillierte Illustration eines kleinen Jungen sehen? Dieses Exemplar wird voraussichtlich Ende Januar&nbsp;2026 auf die Welt kommen." },
  final3:  { final: "03-rover.jpg",    message: "<i>Operator:</i> <q>Sir! Sir! Der Rover hat 'was gefunden!</q><br><i>Chef:</i> <q>Ist das überhaupt möglich? Mein Gott! Es sieht so aus, als würde Ende Januar&nbsp;2026 ein kleiner Junge auf die Erde kommen!</q>" },
  final4:  { final: "04-baba.jpg",     message: "Oh ja, ich sehe sie ganz klar, die Zukunft! Ein Baby... ja... ein Junge. Er wird geboren Ende... März? Nein! Ende Januar&nbsp;2026!" },
  final5:  { final: "05-book.jpg",     message: "Eilmeldung aus der Literaturwelt! Der New York Times-Bestseller 'Oh Boy, it’s a Boy' hat in Rekordzeit die Spitze der Charts erreicht. Und hier kommt die unglaubliche Neuigkeit &mdash; er basiert auf einer wahren Geschichte! Der Hauptcharakter soll Ende Januar&nbsp;2026 die Welt erblicken. Bleiben Sie dran, während wir die außergewöhnliche Reise dieses bald geborenen Protagonisten verfolgen." },
  final6:  { final: "06-mus.jpg",      message: "Hallo liebi Zuehörerinne und Zuehörer! Üse nöchsti Song stammt us de neuste Sammelplatte 'It’s a Boy'. Er kenned dLieder sicher scho, aber händr de au gwüsst, dass sAlbum amne Bueb gwidmet isch, wo ersch Endi Januar&nbsp;2026 ufd Welt chunnt? Hät was, oder? Aso, lehned eu zruck und genüssed It's a Boy vo The Who uf Radio Altishuuse!" },
  final7:  { final: "07-photo.jpg",    message: "Heutzutage ist echt jeder ein Kunstkritiker! Aber hey, wir können mehr Fotos teilen, sobald unser Junge Ende Januar&nbsp;2026 auf die Welt kommt." },
  final8:  { final: "08-gall.jpg",     message: "Man muss das Werk für seinen mutigen Umgang mit Themen wie Ursprung und Verwandlung loben &mdash; eine Meditation über die vielen Dimensionen neuen Lebens. Seine emotionale Tiefe lässt selbst den stoischen Betrachter nicht unberührt. Ach wirklich? Das Werk ist tatsächlich vom Sohn der Künstlerin inspiriert, der Ende Januar&nbsp;2026 zur Welt kommt &mdash; wie zutiefst intim, wie wunderschön prophetisch."},
  final9:  { final: "09-cultured_man.jpg", message: "Ich sag's euch, meine Eltern haben schon an vielen Orten gelebt. Sie haben die besten Pommes schnabuliert und köstliche Baguettes gemampft. Sie sind nie unpünktlich mit der Präzision schweizer Uhren und immer stilvoll mit Lederhosen. Und ich? Ich werde stolz meine texanischen Wurzeln zeigen, wenn ich Ende Januar&nbsp;2026 geboren werde." },
  final10: { final: "10-got-mail.jpg", message: "Howdy!<br>Wir sind für etwa zwei Jahren im Süden der USA sesshaft geworden &mdash; wo die Sommer sich ins Unermessliche ziehen (Länge? Hitze? Beides!), die Longhorns ihr eigenes Motto haben, Willie Nelson die Kanabis-Lobby im Alleingang führt, der 5. November keine Chance gegen das Alamo hat und man sein Pferd Halloween gerecht sattelt.<br>Ja, richtig geraten: Grüße aus Austin, Texas &mdash; dem Staat, in dem alles GRÖSSER ist &mdash; auch ich, aber ich habe eine gute Ausrede &mdash; und nicht nur Jeni’s Ice Cream nebenan! ;) Ich esse eben für zwei bis Ende Januar&nbsp;2026, also haltet Ausschau nach dem neuen Sheriff // Cowboy // Revolverhelden in der Stadt.<br>Vorfreudige Grüße! &ndash; Vany, Sven und der Boiiii" },
  final11: { final: "11-mtg.jpg",      message: "‚Big Baby Boy?‘ Ist das wieder so eine Universes Beyond-Karte? Ich sag’s euch, die machen heutzutage aus allem eine Karte. Und jetzt auch über einen Jungen, der noch gar nicht geboren ist? Sie hätten wenigstens bis nach seiner Geburt Ende Januar&nbsp;2026 warten können. Mensch, warum konnte es nicht wieder ein Eichhörnchen sein?" },
  final12: { final: "12-hallow.jpg",   message: "Er... wird... euch... heimsuchen!!! <br /> Die gruselig-neue Serie 'It’s a Boy' feiert ihr schauriges Debüt Ende Januar&nbsp;2026 &mdash; direkt nach der Geburt des Protagonisten." },
  final13: { final: "13-vint.jpg",     message: "<i>*Altmodische Ansagerstimme*</i>&nbsp; Meine Damen und Herren, merken Sie sich den Termin: Ende Januar&nbsp;2026 begrüßen wir ein neues Familienmitglied! Ein kleiner Junge wird seinen großen Auftritt haben und sich auf ein spannendes neues Abenteuer begeben. Bleiben Sie dran für all die Aufregung!" }
    };

    const container = document.getElementById("game");
    const title = document.getElementById("main-title");
    const subtitle = document.getElementById("sub-title");

    function showStep(step) {
      container.innerHTML = "";
      const node = paths[step];

      if (node.final) {
        // Change title and subtitle for final screens
        title.textContent = FINAL_TITLE;
        subtitle.textContent = FINAL_SUBTITLE;

        const finalDiv = document.createElement("div");
        finalDiv.className = "final";
        finalDiv.innerHTML = `
          <h2>${node.message || "COMING SOON JANUARY 2026"}</h2>
          <img src="${node.final}" alt="Final Result" class="final-img ${step}">
          <br>
          <button class="play-again" onclick="location.reload()">Nochmal von vorne!</button>
        `;
        container.appendChild(finalDiv);
      } else {
        // Reset title and subtitle for choices
        title.textContent = "Triff deine Wahl.";
        subtitle.textContent = "Wie wirst du die Wahrheit herausfinden?"; // what would it be?

        const choiceDiv = document.createElement("div");
        choiceDiv.className = "choice-container";

        node.images.forEach((src, index) => {
          const c = document.createElement("div");
          c.className = "choice";
          c.innerHTML = `
            <p>${node.labels[index]}</p>
            <img src="${src}" alt="Choice">
          `;
          c.onclick = () => showStep(node.next[index]);
          choiceDiv.appendChild(c);
        });

        container.appendChild(choiceDiv);
      }
    }

    showStep("start");
  </script>

</body>
</html>
